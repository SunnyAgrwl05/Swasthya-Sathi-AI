<svg width="860" height="520" viewBox="0 0 860 520" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @keyframes fadeIn {
        0% { opacity: 0; transform: translateY(8px); }
        100% { opacity: 1; transform: translateY(0); }
      }
      @keyframes pulseDot {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.4; transform: scale(0.85); }
      }
      .bubble-user {
        animation: fadeIn 0.6s ease forwards;
      }
      .bubble-tool {
        animation: fadeIn 0.7s ease 0.8s forwards;
        opacity: 0;
      }
      .bubble-agent {
        animation: fadeIn 0.8s ease 1.6s forwards;
        opacity: 0;
      }
      .pulsing-dot {
        animation: pulseDot 1.8s infinite ease-in-out;
      }
    </style>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080B10"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#080B10"/>
    </linearGradient>
    <linearGradient id="headerGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1B4965"/>
      <stop offset="100%" stop-color="#0B2545"/>
    </linearGradient>
    <linearGradient id="cyanBadge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22E1B2"/>
      <stop offset="100%" stop-color="#5B8CFF"/>
    </linearGradient>
  </defs>

  <!-- Background window -->
  <rect width="860" height="520" rx="16" fill="url(#bg)" stroke="#1E293B" stroke-width="2"/>

  <!-- Window title bar -->
  <rect width="860" height="48" rx="16" fill="#0F172A"/>
  <rect y="36" width="860" height="12" fill="#0F172A"/>
  <line x1="0" y1="48" x2="860" y2="48" stroke="#1E293B" stroke-width="1.5"/>

  <!-- Window controls -->
  <circle cx="28" cy="24" r="6" fill="#EF4444"/>
  <circle cx="48" cy="24" r="6" fill="#F59E0B"/>
  <circle cx="68" cy="24" r="6" fill="#10B981"/>

  <!-- Window title -->
  <text x="430" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#94A3B8" text-anchor="middle">Swasthya Sathi AI — Operations Agent Demo</text>

  <!-- Header Banner inside Chat -->
  <g transform="translate(30, 68)">
    <rect width="800" height="50" rx="10" fill="url(#headerGrad)" stroke="#22E1B2" stroke-opacity="0.25"/>
    <circle cx="28" cy="25" r="7" fill="#22E1B2" class="pulsing-dot"/>
    <text x="46" y="29" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">🤖 AI Operations Agent (Bihar Health Department)</text>
    <rect x="670" y="15" width="115" height="22" rx="11" fill="#22E1B2" fill-opacity="0.15" stroke="#22E1B2" stroke-opacity="0.3"/>
    <text x="727" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#22E1B2" text-anchor="middle">Online · Tool Ready</text>
  </g>

  <!-- Message 1: User prompt (Hindi / Natural Language) -->
  <g transform="translate(240, 138)" class="bubble-user">
    <rect width="590" height="56" rx="14" fill="#1E293B" stroke="#334155" stroke-width="1.2"/>
    <text x="20" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#38BDF8">PHC Supervisor (Field Operation)</text>
    <text x="20" y="44" font-family="'Noto Sans Devanagari', -apple-system, sans-serif" font-size="13" fill="#F1F5F9">"Sunita Devi ko aaj present mark karo aur uska monthly attendance summary dikhao"</text>
  </g>

  <!-- Tool execution chips (Function Calling) -->
  <g transform="translate(50, 210)" class="bubble-tool">
    <rect width="180" height="28" rx="14" fill="#064E3B" stroke="#10B981" stroke-opacity="0.4"/>
    <text x="90" y="18" font-family="monospace" font-size="11" font-weight="600" fill="#34D399" text-anchor="middle">✓ mark_attendance</text>

    <rect x="190" y="0" width="190" height="28" rx="14" fill="#064E3B" stroke="#10B981" stroke-opacity="0.4"/>
    <text x="285" y="18" font-family="monospace" font-size="11" font-weight="600" fill="#34D399" text-anchor="middle">✓ get_worker_summary</text>

    <rect x="390" y="0" width="165" height="28" rx="14" fill="#1E1B4B" stroke="#6366F1" stroke-opacity="0.4"/>
    <text x="472" y="18" font-family="monospace" font-size="11" font-weight="600" fill="#A5B4FC" text-anchor="middle">⚡ Gemini Tool Chain</text>
  </g>

  <!-- Message 2: Agent Response -->
  <g transform="translate(30, 256)" class="bubble-agent">
    <rect width="800" height="175" rx="14" fill="#0F172A" stroke="#22E1B2" stroke-opacity="0.3" stroke-width="1.5"/>

    <text x="24" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#22E1B2">🤖 Swasthya Sathi AI</text>

    <text x="24" y="56" font-family="'Noto Sans Devanagari', -apple-system, sans-serif" font-size="13" font-weight="600" fill="#FFFFFF">✅ सुनीता देवी (ASHA कार्यकर्ता) की उपस्थिति आज सफलतापूर्वक दर्ज कर दी गई है।</text>

    <line x1="24" y1="72" x2="776" y2="72" stroke="#1E293B" stroke-width="1"/>

    <text x="24" y="96" font-family="'Noto Sans Devanagari', -apple-system, sans-serif" font-size="12.5" fill="#CBD5E1">📊 मासिक उपस्थिति सारांश (Monthly Summary):</text>
    <text x="40" y="120" font-family="'Noto Sans Devanagari', -apple-system, sans-serif" font-size="12" fill="#94A3B8">• कुल कार्य दिवस: <tspan fill="#FFFFFF" font-weight="600">26 दिन</tspan> | उपस्थित: <tspan fill="#34D399" font-weight="600">24 दिन (92.3%)</tspan> | अनुपस्थित: <tspan fill="#F87171" font-weight="600">2 दिन</tspan></text>
    <text x="40" y="142" font-family="'Noto Sans Devanagari', -apple-system, sans-serif" font-size="12" fill="#94A3B8">• स्थिति: <tspan fill="#34D399" font-weight="600">उत्कृष्ट (Active)</tspan> — किसी अतिरिक्त प्रशासनिक फॉलो-अप की आवश्यकता नहीं है।</text>

    <!-- PDF download action pill -->
    <rect x="650" y="130" width="130" height="30" rx="8" fill="#16A34A"/>
    <text x="715" y="150" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#FFFFFF" text-anchor="middle">📄 Export PDF</text>
  </g>

  <!-- Input bar bottom -->
  <g transform="translate(30, 452)">
    <rect width="800" height="44" rx="12" fill="#1E293B" stroke="#334155"/>
    <text x="18" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#64748B">Type a message in Hindi or English (e.g. Aaj kaun absent hai?)...</text>
    <rect x="740" y="8" width="48" height="28" rx="8" fill="url(#cyanBadge)"/>
    <polygon points="760,16 760,28 770,22" fill="#080B10"/>
  </g>
</svg>
